openapi: 3.1.0
info:
  title: Adzunova Identity Service API
  version: 1.0.0
  description: Authentication, credentials, sessions and identity lifecycle
servers:
  - url: http://localhost:4101/api/v1
paths:
  /:
    get:
      summary: Service information
      responses:
        '200':
          description: Service is available
  /health/live:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Required dependencies are ready
