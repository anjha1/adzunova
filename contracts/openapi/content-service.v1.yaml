openapi: 3.1.0
info:
  title: Adzunova Content Service API
  version: 1.0.0
  description: Content submissions, media metadata, review and moderation
servers:
  - url: http://localhost:4114/api/v1
paths:
  /:
    get:
      summary: Service information
      responses:
        '200':
          description: Service is available
  /health/live:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Required dependencies are ready
