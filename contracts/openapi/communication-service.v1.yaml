openapi: 3.1.0
info:
  title: Adzunova Communication Service API
  version: 1.0.0
  description: Conversation and message persistence and orchestration
servers:
  - url: http://localhost:4112/api/v1
paths:
  /:
    get:
      summary: Service information
      responses:
        '200':
          description: Service is available
  /health/live:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Required dependencies are ready
